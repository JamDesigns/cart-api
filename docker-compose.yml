name: api_cart

services:
  app:
    build: .
    container_name: api_cart
    ports:
      - "8000:8000"  # Exposing application port 8000
    volumes:
      - .:/var/www/html
      - sqlite-data:/var/www/html/var
      - sqlite-test-data:/var/www/html/var/test-data
      - /var/www/html/var/cache
      - /var/www/html/var/log
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/var/data.db  # Path where the SQLite database file is stored
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  sqlite-data:
  sqlite-test-data:
