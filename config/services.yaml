# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters: {}

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Cart\Infrastructure\Persistence\InMemoryCartRepository:
        public: true
        autowire: true
        autoconfigure: true

    App\Cart\Infrastructure\Controller\CartController:
        public: true
        autowire: true
        autoconfigure: true

    App\Cart\Infrastructure\Controller\CartModificationController:
        public: true
        autowire: true
        autoconfigure: true

    App\Cart\Infrastructure\Controller\CartQueryController:
        public: true
        autowire: true
        autoconfigure: true

    App\Cart\Domain\Repository\CartRepository:
        alias: App\Cart\Infrastructure\Persistence\Doctrine\DoctrineCartRepository

    App\Checkout\Infrastructure\Controller\CheckoutController:
        public: true
        autowire: true
        autoconfigure: true

    App\Checkout\Infrastructure\Controller\OrderQueryController:
        tags: ['controller.service_arguments']

    App\Checkout\Domain\Repository\OrderRepository:
        alias: App\Checkout\Infrastructure\Persistence\Doctrine\DoctrineOrderRepository

    App\Shared\Application\Transaction\TransactionManager:
        alias: App\Shared\Infrastructure\Persistence\Doctrine\DoctrineTransactionManager
